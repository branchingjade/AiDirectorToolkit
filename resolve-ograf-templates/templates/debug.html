<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=1920">
<title>OGraf 交互调试台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a1a;color:#aaa;font-family:"Microsoft YaHei",sans-serif;display:flex}
.side{width:380px;background:#222;padding:20px;overflow-y:auto;height:100vh;position:sticky;top:0}
.side h2{color:#cdb896;font-size:16px;margin:16px 0 8px;border-bottom:1px solid #333;padding-bottom:4px}
.side label{display:block;font-size:12px;color:#888;margin:6px 0 2px}
.side input[type=text]{width:100%;padding:4px 8px;background:#333;border:1px solid #444;color:#ddd;font-size:13px;border-radius:3px}
.side input[type=color]{width:100%;height:28px;border:none;background:transparent;cursor:pointer}
.main{flex:1;padding:20px 20px 20px 0}
.frame{position:relative;width:1280px;height:360px;margin:0 auto 6px;background:radial-gradient(ellipse at center,#2a2520 0%,#0d0b08 100%);overflow:hidden}
.frame::after{content:attr(data-label);position:absolute;top:8px;left:12px;font-size:11px;color:#444}
</style>
</head>
<body>
<!-- INSERT YOUR CSS + HTML HERE, using var(--name) for inspector-controlled values -->
<!-- Sidebar controls update CSS custom properties and text content via oninput -->
<div class="side">
  <h2>方案名</h2>
  <label>人名 <input type="text" value="默认" oninput="apply(0)"></label>
  <label>职位 <input type="text" value="默认" oninput="apply(0)"></label>
  <label>主色 <input type="color" value="#cdb896" oninput="apply(0)"></label>
  <label>辅色 <input type="color" value="#a09078" oninput="apply(0)"></label>
</div>
<div class="main">
  <div class="frame" data-label="方案">
    <div class="n"></div><div class="u"></div>
  </div>
</div>
<script>
// apply(idx) reads sidebar inputs and pushes values to frame[idx]
const frames=document.querySelectorAll('.frame');
function apply(idx){
  const inputs=document.querySelectorAll('.side input');
  const off=idx*4;
  const f=frames[idx];
  f.querySelector('.n').textContent=inputs[off].value;
  f.querySelector('.u').textContent=inputs[off+1].value;
  f.style.setProperty('--primary',inputs[off+2].value);
  f.style.setProperty('--accent',inputs[off+3].value);
}
apply(0);
</script>
</body>
</html>
