<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>{{title}}</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d0d0d;color:#ccc;font-family:"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}
  .wrap{max-width:1200px;margin:0 auto;padding:40px 20px}
  h1{color:#fff;font-size:28px;margin-bottom:8px}
  .sub{color:#888;font-size:14px;margin-bottom:40px}
  h2{color:#e0c070;font-size:20px;margin:48px 0 16px;border-left:3px solid #e0c070;padding-left:12px}
  p{margin:10px 0}
  .frames{display:flex;gap:16px;margin:20px 0;flex-wrap:wrap}
  .frame-card{flex:1;min-width:300px;background:#1a1a1a;border-radius:8px;overflow:hidden}
  .frame-card img{width:100%;display:block}
  .caption{padding:12px 16px;font-size:13px;color:#888;background:#141414}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
  @media(max-width:700px){.grid{grid-template-columns:1fr}}
  .good{background:#0f2a1a;border:1px solid #1a5a2a;border-radius:6px;padding:16px}
  .good h3{color:#4a8;margin:0 0 8px}
  .warn{background:#2a1f0f;border:1px solid #5a3a1a;border-radius:6px;padding:16px}
  .warn h3{color:#c80;margin:0 0 8px}
  .good li,.warn li{margin:4px 0 4px 16px}
  .verdict{background:#1a1a2e;border:1px solid #334;border-radius:12px;padding:24px;margin:32px 0}
  .verdict p{font-size:17px;color:#dde}
</style>
</head>
<body>
<div class="wrap">
<h1>{{title}}</h1>
<div class="sub">{{subtitle}}</div>

<h2>帧采样</h2>
<div class="frames">{{frames_html}}</div>

{{sections}}
</div>
</body>
</html>
